<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calibration Timeline</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; color: #eee; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow-x: hidden; }

  .header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: #1a1a1a; border-bottom: 1px solid #333;
    padding: 12px 20px; display: flex; align-items: center; gap: 20px;
  }
  .header h1 { font-size: 18px; font-weight: 600; white-space: nowrap; }
  .progress-bar { flex: 1; height: 8px; background: #333; border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: #4caf50; border-radius: 4px; transition: width 0.3s; }
  .progress-text { font-size: 13px; color: #aaa; white-space: nowrap; }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; }
  .status-dot.live { background: #4caf50; animation: pulse 2s infinite; }
  .status-dot.done { background: #666; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  .insights {
    position: fixed; top: 53px; left: 0; right: 0; z-index: 99;
    background: #1a1a1a; border-bottom: 1px solid #333;
    padding: 10px 20px; font-size: 13px; color: #aaa;
    display: flex; gap: 24px; overflow-x: auto;
  }
  .insight-card {
    background: #222; border-radius: 6px; padding: 8px 14px;
    white-space: nowrap; flex-shrink: 0;
  }
  .insight-card .label { color: #888; font-size: 11px; text-transform: uppercase; }
  .insight-card .value { color: #eee; font-size: 16px; font-weight: 600; margin-top: 2px; }
  .insight-card .value.good { color: #4caf50; }
  .insight-card .value.warn { color: #ff9800; }
  .insight-card .value.bad { color: #f44336; }

  .timeline {
    margin-top: 110px; padding: 20px;
    display: flex; gap: 16px; overflow-x: auto;
    scroll-behavior: smooth; min-height: calc(100vh - 110px);
  }
  .timeline::-webkit-scrollbar { height: 8px; }
  .timeline::-webkit-scrollbar-track { background: #222; }
  .timeline::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }

  .card {
    flex-shrink: 0; width: 340px; background: #1a1a1a;
    border-radius: 10px; border: 1px solid #333; overflow: hidden;
  }
  .card.active { border-color: #4caf50; box-shadow: 0 0 12px rgba(76,175,80,0.3); }
  .card-img {
    width: 340px; height: 260px; object-fit: cover; display: block;
    cursor: pointer; transition: transform 0.2s;
  }
  .card-img:hover { transform: scale(1.02); }
  .card-body { padding: 12px; }
  .card-title { font-size: 14px; font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .card-title .step { color: #888; font-size: 12px; }
  .color-swatch {
    display: inline-block; width: 20px; height: 20px; border-radius: 4px;
    border: 1px solid #555; vertical-align: middle;
  }
  .card-row { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; color: #aaa; }
  .card-row .label { color: #777; }
  .card-phase { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; padding: 2px 6px; border-radius: 3px; }
  .card-phase.strip { background: #2a1a1a; color: #ff6b6b; }
  .card-phase.ref { background: #1a2a1a; color: #6bff6b; }
  .card-phase.verify { background: #1a1a2a; color: #6b6bff; }
  .card-phase.capturing { background: #2a2a1a; color: #ffff6b; }
  .grade { font-size: 13px; font-weight: 700; padding: 2px 8px; border-radius: 3px; display: inline-block; margin-top: 4px; }
  .grade.Excellent { background: #1a3a1a; color: #4caf50; }
  .grade.Good { background: #1a2a1a; color: #8bc34a; }
  .grade.Fair { background: #2a2a1a; color: #ff9800; }
  .grade.Poor { background: #2a1a1a; color: #f44336; }
  .grade.Bad { background: #3a1a1a; color: #ff1744; }
  .channel-note { font-size: 11px; color: #888; padding: 1px 0; }

  .empty {
    display: flex; align-items: center; justify-content: center;
    height: calc(100vh - 110px); width: 100%; color: #555; font-size: 18px;
  }

  /* Lightbox */
  .lightbox {
    display: none; position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.95); align-items: center; justify-content: center;
    cursor: zoom-out;
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 95vw; max-height: 95vh; object-fit: contain; }

  .nav-hint {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    color: #555; font-size: 12px; z-index: 98;
  }
</style>
</head>
<body>

<div class="header">
  <div class="status-dot" id="statusDot"></div>
  <h1>Calibration Timeline</h1>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-text" id="progressText">Loading...</div>
</div>

<div class="insights" id="insights"></div>

<div class="timeline" id="timeline">
  <div class="empty" id="emptyMsg">Waiting for calibration data...</div>
</div>

<div class="lightbox" id="lightbox" onclick="this.classList.remove('open')">
  <img id="lightboxImg" src="">
</div>

<div class="nav-hint">Scroll horizontally to browse &bull; Click photo to enlarge &bull; Auto-refreshes every 3s</div>

<script>
const REFRESH_MS = 3000;
let lastCount = 0;
let autoScroll = true;
let cacheBust = Date.now();

function rgb(r, g, b) { return `rgb(${r},${g},${b})`; }
function hexColor(r, g, b) { return '#' + [r,g,b].map(c => c.toString(16).padStart(2,'0')).join(''); }

function euclidean(a, b) {
  return Math.sqrt(a.reduce((s, v, i) => s + (v - b[i]) ** 2, 0));
}

function renderInsights(data) {
  const el = document.getElementById('insights');
  if (!data.measurements || data.measurements.length === 0) {
    el.innerHTML = '<div class="insight-card"><div class="label">Status</div><div class="value">Waiting for measurements</div></div>';
    return;
  }

  const m = data.measurements;
  const total = data.total_colors || '?';
  const done = m.length;

  // Compute average channel ratios
  let ratios = { r: [], g: [], b: [] };
  m.forEach(mi => {
    ['r','g','b'].forEach((ch, i) => {
      if (mi.ref_seen[i] > 10) {
        ratios[ch].push(mi.strip_seen[i] / mi.ref_seen[i]);
      }
    });
  });

  const avgRatio = ch => ratios[ch].length ? (ratios[ch].reduce((a,b)=>a+b,0) / ratios[ch].length).toFixed(2) : '—';
  const maxError = m.reduce((mx, mi) => Math.max(mx, euclidean(mi.ref_seen, mi.strip_seen)), 0);

  let html = '';
  html += `<div class="insight-card"><div class="label">Progress</div><div class="value">${done} / ${total} colors</div></div>`;
  html += `<div class="insight-card"><div class="label">R Ratio (strip/ref)</div><div class="value">${avgRatio('r')}</div></div>`;
  html += `<div class="insight-card"><div class="label">G Ratio</div><div class="value">${avgRatio('g')}</div></div>`;
  html += `<div class="insight-card"><div class="label">B Ratio</div><div class="value">${avgRatio('b')}</div></div>`;
  html += `<div class="insight-card"><div class="label">Max Error</div><div class="value ${maxError > 80 ? 'bad' : maxError > 40 ? 'warn' : 'good'}">${maxError.toFixed(1)}</div></div>`;

  if (data.correction_lut) {
    html += `<div class="insight-card"><div class="label">LUT</div><div class="value good">Ready</div></div>`;
  }
  if (data.verification) {
    const avgErr = data.verification.reduce((s,v) => s + v.euclidean_error, 0) / data.verification.length;
    html += `<div class="insight-card"><div class="label">Verify Avg Error</div><div class="value ${avgErr > 40 ? 'bad' : avgErr > 20 ? 'warn' : 'good'}">${avgErr.toFixed(1)}</div></div>`;
  }

  el.innerHTML = html;
}

function renderTimeline(data) {
  const tl = document.getElementById('timeline');
  const empty = document.getElementById('emptyMsg');

  if (!data.photos || data.photos.length === 0) {
    empty.style.display = 'flex';
    return;
  }
  empty.style.display = 'none';

  // Build measurement lookup by photo filename
  const byPhoto = {};
  if (data.measurements) {
    data.measurements.forEach((m, i) => {
      if (m.photo_strip) byPhoto[m.photo_strip] = { ...m, index: i, phase: 'strip' };
      if (m.photo_ref) byPhoto[m.photo_ref] = { ...m, index: i, phase: 'ref' };
      if (m.photo) byPhoto[m.photo] = { ...m, index: i, phase: 'both' };
    });
  }

  // Build verification lookup
  if (data.verification) {
    data.verification.forEach((v, i) => {
      if (v.photo) byPhoto[v.photo] = { ...v, index: i, phase: 'verify' };
    });
  }

  let html = '';
  data.photos.forEach((photo, idx) => {
    const m = byPhoto[photo];
    const isLatest = idx === data.photos.length - 1;

    html += `<div class="card ${isLatest ? 'active' : ''}">`;
    html += `<img class="card-img" src="/calibration/photo/${encodeURIComponent(photo)}?t=${cacheBust}" onclick="openLightbox(this.src)" loading="lazy">`;
    html += `<div class="card-body">`;
    html += `<div class="card-title"><span class="step">#${idx + 1}</span> `;

    if (m) {
      const inp = m.input_rgb || m.target_rgb || [0,0,0];
      const phaseLabel = m.phase === 'strip' ? '<span class="card-phase strip">Strip</span>'
                       : m.phase === 'ref' ? '<span class="card-phase ref">Reference</span>'
                       : m.phase === 'verify' ? '<span class="card-phase verify">Verify</span>'
                       : '';
      html += `${phaseLabel} `;
      html += `<span class="color-swatch" style="background:${rgb(...inp)}"></span> `;
      html += `RGB(${inp.join(',')})`;
      html += `</div>`;

      if (m.phase === 'strip' && m.strip_seen) {
        const ss = m.strip_seen;
        html += `<div class="card-row"><span class="label">Strip seen</span><span><span class="color-swatch" style="background:${rgb(Math.round(ss[0]),Math.round(ss[1]),Math.round(ss[2]))};width:14px;height:14px"></span> (${ss.map(v=>Math.round(v)).join(', ')})</span></div>`;
      }
      if (m.phase === 'ref' && m.ref_seen) {
        const rs = m.ref_seen;
        html += `<div class="card-row"><span class="label">Ref seen</span><span><span class="color-swatch" style="background:${rgb(Math.round(rs[0]),Math.round(rs[1]),Math.round(rs[2]))};width:14px;height:14px"></span> (${rs.map(v=>Math.round(v)).join(', ')})</span></div>`;
      }
      if (m.ref_seen && m.strip_seen) {
        const err = euclidean(m.ref_seen, m.strip_seen);
        html += `<div class="card-row"><span class="label">Error</span><span>${err.toFixed(1)}</span></div>`;
      }
      if (m.euclidean_error !== undefined) {
        html += `<div class="card-row"><span class="label">Euclidean Error</span><span>${m.euclidean_error.toFixed(1)}</span></div>`;
      }
      if (m.corrected_rgb) {
        html += `<div class="card-row"><span class="label">Corrected</span><span><span class="color-swatch" style="background:${rgb(...m.corrected_rgb)};width:14px;height:14px"></span> (${m.corrected_rgb.join(', ')})</span></div>`;
      }
      if (m.opinion) {
        html += `<div class="grade ${m.opinion.grade}">${m.opinion.grade} (${m.opinion.euclidean_error})</div>`;
        if (m.opinion.channel_notes) {
          m.opinion.channel_notes.forEach(note => {
            html += `<div class="channel-note">${note}</div>`;
          });
        }
      }
      if (m.status === 'strip_captured') {
        html += `<div class="card-phase capturing">Awaiting ref...</div>`;
      }
    } else {
      html += `${photo}</div>`;
    }

    html += `</div></div>`;
  });

  tl.innerHTML = html;

  // Auto-scroll to latest
  if (autoScroll && data.photos.length > lastCount) {
    lastCount = data.photos.length;
    requestAnimationFrame(() => tl.scrollLeft = tl.scrollWidth);
  }
}

function updateProgress(data) {
  const dot = document.getElementById('statusDot');
  const fill = document.getElementById('progressFill');
  const text = document.getElementById('progressText');

  const done = data.measurements ? data.measurements.length : 0;
  const total = data.total_colors || 1;
  const pct = Math.min(100, (done / total) * 100);

  fill.style.width = pct + '%';

  if (data.complete) {
    dot.className = 'status-dot done';
    text.textContent = data.verification ? 'Verified' : 'Complete';
  } else {
    dot.className = 'status-dot live';
    text.textContent = `${done}/${total} (${Math.round(pct)}%)`;
  }
}

function openLightbox(src) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('open');
}

// Disable auto-scroll on manual scroll
document.getElementById('timeline').addEventListener('scroll', function(e) {
  const tl = e.target;
  if (tl.scrollLeft < tl.scrollWidth - tl.clientWidth - 50) {
    autoScroll = false;
  } else {
    autoScroll = true;
  }
});

async function refresh() {
  try {
    const resp = await fetch('/calibration/data?t=' + Date.now());
    if (!resp.ok) return;
    const data = await resp.json();
    cacheBust = Date.now();
    renderInsights(data);
    renderTimeline(data);
    updateProgress(data);
  } catch (e) { /* retry next cycle */ }
}

refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELK-BLEDOM Dashboard</title>
<style>
:root {
  --bg: #1a1a2e;
  --bg2: #16213e;
  --bg3: #0f3460;
  --fg: #e0e0e0;
  --fg2: #a0a0b0;
  --accent: #e94560;
  --green: #4ade80;
  --red: #f87171;
  --border: #2a2a4a;
  --radius: 6px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--fg);
  padding: 10px;
}
h2 { font-size: 0.85em; font-weight: 600; margin-bottom: 8px; color: var(--fg2); text-transform: uppercase; letter-spacing: 0.05em; }

/* Header */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 14px; background: var(--bg2); border-radius: var(--radius);
  margin-bottom: 8px; border: 1px solid var(--border);
}
.header h1 { font-size: 1.1em; }
.header-right { display: flex; gap: 12px; align-items: center; }
.status-dot {
  display: inline-block; width: 10px; height: 10px; border-radius: 50%;
  background: var(--red); margin-right: 4px; vertical-align: middle;
}
.status-dot.connected { background: var(--green); }
.strip-label { font-size: 0.8em; }

/* Target selector */
.target-bar {
  display: flex; gap: 10px; align-items: center;
  padding: 6px 14px; background: var(--bg2); border-radius: var(--radius);
  margin-bottom: 8px; border: 1px solid var(--border); font-size: 0.85em;
}
.target-bar label { cursor: pointer; }
.target-bar input[type="radio"] { accent-color: var(--accent); }

/* Cards */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
@media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
.card {
  background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 10px;
}

/* Buttons */
.btn {
  padding: 5px 12px; border: none; border-radius: var(--radius); cursor: pointer;
  font-size: 0.8em; font-weight: 500; transition: opacity 0.15s;
}
.btn:hover { opacity: 0.85; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-secondary { background: var(--bg3); color: var(--fg); }
.btn-success { background: #059669; color: #fff; }
.btn-danger { background: #dc2626; color: #fff; }
.btn-sm { padding: 3px 8px; font-size: 0.75em; }
.btn-group { display: flex; gap: 6px; flex-wrap: wrap; }

/* Inputs */
input[type="number"], input[type="text"], select {
  background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
  color: var(--fg); padding: 4px 6px; font-size: 0.8em; width: 100%;
}
input[type="color"] {
  width: 44px; height: 28px; border: 1px solid var(--border); border-radius: 4px;
  background: var(--bg); cursor: pointer; padding: 2px;
}
input[type="range"] { width: 100%; accent-color: var(--accent); }

/* Color controls */
.color-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.color-input-group { display: flex; gap: 4px; align-items: center; }
.color-input-group label { font-size: 0.75em; color: var(--fg2); }
.color-input-group input[type="number"] { width: 52px; }
.slider-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.slider-row label { min-width: 65px; font-size: 0.8em; }
.slider-row .val { min-width: 35px; text-align: right; font-size: 0.8em; color: var(--fg2); }

/* Effects */
.effect-row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
.effect-row select { flex: 1; }

/* Pattern table */
.pattern-table { width: 100%; border-collapse: collapse; font-size: 0.8em; }
.pattern-table th {
  text-align: left; padding: 4px 6px; border-bottom: 2px solid var(--border);
  color: var(--fg2); font-weight: 500; font-size: 0.75em;
}
.pattern-table td { padding: 3px 6px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.pattern-table input[type="color"] { width: 34px; height: 24px; }
.pattern-table input[type="number"] { width: 50px; }
.pattern-table select { width: 70px; }
.pattern-table-wrap { max-height: 260px; overflow-y: auto; margin-bottom: 8px; }

/* Playback bar */
.playback-bar {
  display: flex; gap: 8px; align-items: center; margin-top: 8px;
  padding: 8px; background: var(--bg); border-radius: var(--radius);
}
.playback-info { font-size: 0.8em; color: var(--fg2); flex: 1; }
.playback-color {
  display: inline-block; width: 16px; height: 16px; border-radius: 3px;
  border: 1px solid var(--border); vertical-align: middle;
}

/* Preset row */
.preset-row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.preset-row select { flex: 1; min-width: 140px; }

/* Toast */
.toast {
  position: fixed; bottom: 20px; right: 20px; padding: 10px 16px;
  background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius);
  color: var(--fg); font-size: 0.85em; z-index: 100; opacity: 0; transition: opacity 0.3s;
  pointer-events: none;
}
.toast.show { opacity: 1; }
.toast.error { border-color: var(--red); }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <h1>ELK-BLEDOM Dashboard</h1>
  <div class="header-right">
    <span class="strip-label"><span id="dot1" class="status-dot"></span>Strip 1</span>
    <span class="strip-label"><span id="dot2" class="status-dot"></span>Strip 2</span>
    <button class="btn btn-success btn-sm" onclick="doConnect()">Connect</button>
    <button class="btn btn-danger btn-sm" onclick="doDisconnect()">Disconnect</button>
  </div>
</div>

<!-- Target -->
<div class="target-bar">
  <span style="color:var(--fg2)">Target:</span>
  <label><input type="radio" name="target" value="strip1"> Strip 1</label>
  <label><input type="radio" name="target" value="strip2"> Strip 2</label>
  <label><input type="radio" name="target" value="both" checked> Both</label>
  <div style="margin-left:auto" class="btn-group">
    <button class="btn btn-success btn-sm" onclick="sendPower(true)">ON</button>
    <button class="btn btn-danger btn-sm" onclick="sendPower(false)">OFF</button>
  </div>
</div>

<!-- Direct Controls + Effects -->
<div class="grid">
  <div class="card">
    <h2>Direct Controls</h2>
    <div class="color-row">
      <input type="color" id="colorPicker" value="#ff0000" oninput="onColorPicker(this.value)">
      <div class="color-input-group">
        <label>R</label><input type="number" id="rVal" min="0" max="255" value="255" onchange="onRgbInput()">
      </div>
      <div class="color-input-group">
        <label>G</label><input type="number" id="gVal" min="0" max="255" value="0" onchange="onRgbInput()">
      </div>
      <div class="color-input-group">
        <label>B</label><input type="number" id="bVal" min="0" max="255" value="0" onchange="onRgbInput()">
      </div>
      <button class="btn btn-primary btn-sm" onclick="sendColor()">Set</button>
    </div>
    <div class="slider-row">
      <label>Brightness</label>
      <input type="range" id="brightnessSlider" min="0" max="255" value="255"
             oninput="document.getElementById('brightnessVal').textContent = Math.round(this.value/255*100)+'%'"
             onchange="sendBrightness()">
      <span class="val" id="brightnessVal">100%</span>
    </div>
  </div>

  <div class="card">
    <h2>Effects</h2>
    <div class="effect-row">
      <select id="effectSelect"></select>
      <button class="btn btn-primary btn-sm" onclick="sendEffect()">Apply</button>
    </div>
    <div class="slider-row">
      <label>Speed</label>
      <input type="range" id="speedSlider" min="1" max="255" value="3"
             oninput="document.getElementById('speedVal').textContent = this.value">
      <span class="val" id="speedVal">3</span>
    </div>
  </div>
</div>

<!-- Pattern -->
<div class="card">
  <h2>Patterns</h2>
  <div class="preset-row">
    <select id="presetSelect" onchange="loadPreset()"><option value="">-- select preset --</option></select>
    <button class="btn btn-secondary btn-sm" onclick="loadPreset()">Load</button>
    <button class="btn btn-secondary btn-sm" onclick="savePreset()">Save</button>
    <button class="btn btn-secondary btn-sm" onclick="renamePreset()">Rename</button>
    <button class="btn btn-secondary btn-sm" onclick="copyPreset()">Copy</button>
    <button class="btn btn-danger btn-sm" onclick="deletePreset()">Del</button>
  </div>

  <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px;padding:6px 8px;background:var(--bg);border-radius:var(--radius);font-size:0.75em">
    <span style="color:var(--fg2);white-space:nowrap">All:</span>
    <label style="flex:1;display:flex;align-items:center;gap:3px">Bright%<input type="number" id="bulkBright" value="" placeholder="--" min="0" max="100" style="width:100%"></label>
    <label style="flex:1;display:flex;align-items:center;gap:3px">Dur(s)<input type="number" id="bulkDur" value="" placeholder="--" min="0.1" max="60" step="0.1" style="width:100%"></label>
    <label style="flex:1;display:flex;align-items:center;gap:3px">Trans<select id="bulkTrans" style="width:100%"><option value="">--</option><option value="cut">Cut</option><option value="fade">Fade</option></select></label>
    <label style="flex:1;display:flex;align-items:center;gap:3px">Fade(s)<input type="number" id="bulkFade" value="" placeholder="--" min="0.1" max="10" step="0.1" style="width:100%"></label>
    <button class="btn btn-secondary btn-sm" onclick="applyBulk()" style="white-space:nowrap">Apply All</button>
  </div>

  <div class="pattern-table-wrap">
  <table class="pattern-table">
    <thead>
      <tr><th>#</th><th>Color</th><th>Bright%</th><th>Dur(s)</th><th>Trans</th><th>Fade(s)</th><th></th></tr>
    </thead>
    <tbody id="patternBody"></tbody>
  </table>
  </div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <button class="btn btn-secondary btn-sm" onclick="addStep()">+ Add Step</button>
    <button class="btn btn-success btn-sm" onclick="playPattern()">&#9654; Play</button>
    <button class="btn btn-danger btn-sm" onclick="stopPattern()">&#9632; Stop</button>
    <label style="font-size:0.8em;display:flex;align-items:center;gap:3px;cursor:pointer">
      <input type="checkbox" id="loopCheck" checked> Loop
    </label>
    <span class="playback-info" id="playbackInfo" style="margin-left:auto">Stopped</span>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// --- State ---
let ws;
let effects = [];
let presets = {};
let patternSteps = [];

// --- Helpers ---
function getTarget() {
  return document.querySelector('input[name="target"]:checked').value;
}
function targetPayload() {
  return { targets: getTarget() };
}
async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(path, opts);
  const data = await res.json();
  if (!res.ok) {
    showToast(data.error || 'Request failed', true);
    throw new Error(data.error);
  }
  return data;
}
function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.className = 'toast', 3000);
}
function hexToRgb(hex) {
  const h = hex.replace('#', '');
  return [parseInt(h.substring(0,2),16), parseInt(h.substring(2,4),16), parseInt(h.substring(4,6),16)];
}
function rgbToHex(r,g,b) {
  return '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
}

// --- Color picker sync ---
function onColorPicker(hex) {
  const [r,g,b] = hexToRgb(hex);
  document.getElementById('rVal').value = r;
  document.getElementById('gVal').value = g;
  document.getElementById('bVal').value = b;
}
function onRgbInput() {
  const r = parseInt(document.getElementById('rVal').value) || 0;
  const g = parseInt(document.getElementById('gVal').value) || 0;
  const b = parseInt(document.getElementById('bVal').value) || 0;
  document.getElementById('colorPicker').value = rgbToHex(r,g,b);
}

// --- Direct controls ---
async function sendColor() {
  const r = parseInt(document.getElementById('rVal').value) || 0;
  const g = parseInt(document.getElementById('gVal').value) || 0;
  const b = parseInt(document.getElementById('bVal').value) || 0;
  await api('POST', '/api/color', { ...targetPayload(), r, g, b });
}
async function sendBrightness() {
  const level = parseInt(document.getElementById('brightnessSlider').value);
  await api('POST', '/api/brightness', { ...targetPayload(), level });
}
async function sendPower(on) {
  await api('POST', '/api/power', { ...targetPayload(), on });
}
async function sendEffect() {
  const effect = document.getElementById('effectSelect').value;
  const speed = parseInt(document.getElementById('speedSlider').value);
  await api('POST', '/api/effect', { ...targetPayload(), effect, speed });
}

// --- Connect/Disconnect ---
async function doConnect() {
  await api('POST', '/api/connect', targetPayload());
  showToast('Connected');
}
async function doDisconnect() {
  await api('POST', '/api/disconnect', targetPayload());
  showToast('Disconnected');
}

// --- Effects ---
async function loadEffects() {
  effects = await api('GET', '/api/effects');
  const sel = document.getElementById('effectSelect');
  sel.innerHTML = effects.map(e => `<option value="${e}">${e.replace(/_/g, ' ')}</option>`).join('');
}

// --- Presets ---
async function loadPresets() {
  presets = await api('GET', '/api/presets');
  const sel = document.getElementById('presetSelect');
  sel.innerHTML = '<option value="">-- select preset --</option>' +
    Object.keys(presets).map(n => `<option value="${n}">${n}</option>`).join('');
}
function loadPreset() {
  const name = document.getElementById('presetSelect').value;
  if (!name || !presets[name]) return;
  patternSteps = JSON.parse(JSON.stringify(presets[name].steps));
  renderPattern();
}
async function savePreset() {
  readPatternFromUI();
  if (patternSteps.length === 0) { showToast('Add steps first', true); return; }
  let name = document.getElementById('presetSelect').value;
  if (!name) name = prompt('Preset name:');
  if (!name) return;
  await api('POST', '/api/presets', { name, pattern: patternSteps });
  showToast('Saved: ' + name);
  await loadPresets();
  document.getElementById('presetSelect').value = name;
}
async function renamePreset() {
  const oldName = document.getElementById('presetSelect').value;
  if (!oldName) return;
  const newName = prompt('Rename "' + oldName + '" to:', oldName);
  if (!newName || newName === oldName) return;
  const data = presets[oldName];
  await api('POST', '/api/presets', { name: newName, pattern: data.steps });
  await api('DELETE', '/api/presets/' + encodeURIComponent(oldName));
  showToast('Renamed to: ' + newName);
  await loadPresets();
  document.getElementById('presetSelect').value = newName;
}
async function copyPreset() {
  const srcName = document.getElementById('presetSelect').value;
  if (!srcName) return;
  const newName = prompt('Copy "' + srcName + '" as:', srcName + ' Copy');
  if (!newName) return;
  await api('POST', '/api/presets', { name: newName, pattern: presets[srcName].steps });
  showToast('Copied as: ' + newName);
  await loadPresets();
  document.getElementById('presetSelect').value = newName;
}
async function deletePreset() {
  const name = document.getElementById('presetSelect').value;
  if (!name) return;
  if (!confirm('Delete "' + name + '"?')) return;
  await api('DELETE', '/api/presets/' + encodeURIComponent(name));
  showToast('Deleted: ' + name);
  await loadPresets();
}

// --- Pattern table ---
function addStep(color, brightness, duration, transition, fadeTime) {
  patternSteps.push({
    color: color || '#ff0000',
    brightness: brightness !== undefined ? brightness : 100,
    duration: duration !== undefined ? duration : 2.0,
    transition: transition || 'cut',
    fade_time: fadeTime !== undefined ? fadeTime : 0.5,
  });
  renderPattern();
}
function removeStep(i) {
  patternSteps.splice(i, 1);
  renderPattern();
}
function renderPattern() {
  const tbody = document.getElementById('patternBody');
  const n = patternSteps.length;
  tbody.innerHTML = patternSteps.map((s, i) => `
    <tr>
      <td>${i+1}</td>
      <td><input type="color" value="${s.color}" data-i="${i}" data-f="color"></td>
      <td><input type="number" value="${s.brightness}" min="0" max="100" data-i="${i}" data-f="brightness" style="width:45px"></td>
      <td><input type="number" value="${s.duration}" min="0.1" max="60" step="0.1" data-i="${i}" data-f="duration" style="width:50px"></td>
      <td><select data-i="${i}" data-f="transition">
            <option value="cut"${s.transition==='cut'?' selected':''}>Cut</option>
            <option value="fade"${s.transition==='fade'?' selected':''}>Fade</option>
          </select></td>
      <td><input type="number" value="${s.fade_time}" min="0.1" max="10" step="0.1" data-i="${i}" data-f="fade_time" style="width:45px"${s.transition==='cut'?' disabled':''}></td>
      <td style="white-space:nowrap">
        <button class="btn btn-secondary btn-sm" onclick="moveStep(${i},-1)" ${i===0?'disabled':''} title="Move up">&#9650;</button>
        <button class="btn btn-secondary btn-sm" onclick="moveStep(${i},1)" ${i===n-1?'disabled':''} title="Move down">&#9660;</button>
        <button class="btn btn-danger btn-sm" onclick="removeStep(${i})" title="Remove">x</button>
      </td>
    </tr>
  `).join('');
  tbody.querySelectorAll('select[data-f="transition"]').forEach(sel => {
    sel.addEventListener('change', function() {
      const fadeInput = this.closest('tr').querySelector('input[data-f="fade_time"]');
      fadeInput.disabled = this.value === 'cut';
    });
  });
}
function moveStep(i, dir) {
  readPatternFromUI();
  const j = i + dir;
  if (j < 0 || j >= patternSteps.length) return;
  [patternSteps[i], patternSteps[j]] = [patternSteps[j], patternSteps[i]];
  renderPattern();
}
function applyBulk() {
  readPatternFromUI();
  const brVal = document.getElementById('bulkBright').value;
  const durVal = document.getElementById('bulkDur').value;
  const transVal = document.getElementById('bulkTrans').value;
  const fadeVal = document.getElementById('bulkFade').value;
  let changed = 0;
  patternSteps.forEach(s => {
    if (brVal !== '') { s.brightness = parseInt(brVal); changed++; }
    if (durVal !== '') { s.duration = parseFloat(durVal); changed++; }
    if (transVal !== '') { s.transition = transVal; changed++; }
    if (fadeVal !== '') { s.fade_time = parseFloat(fadeVal); changed++; }
  });
  if (changed === 0) { showToast('Set a value first', true); return; }
  renderPattern();
  showToast('Applied to all steps');
}
function readPatternFromUI() {
  document.querySelectorAll('#patternBody tr').forEach((tr, i) => {
    if (!patternSteps[i]) return;
    tr.querySelectorAll('[data-f]').forEach(el => {
      const f = el.dataset.f;
      let v = el.value;
      if (f === 'brightness') v = parseInt(v);
      else if (f === 'duration' || f === 'fade_time') v = parseFloat(v);
      patternSteps[i][f] = v;
    });
  });
}

// --- Playback ---
async function playPattern() {
  readPatternFromUI();
  if (patternSteps.length === 0) { showToast('Add steps first', true); return; }
  const loop = document.getElementById('loopCheck').checked;
  await api('POST', '/api/pattern/play', { ...targetPayload(), pattern: patternSteps, loop });
}
async function stopPattern() {
  await api('POST', '/api/pattern/stop', {});
}

// --- WebSocket ---
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host + '/ws');
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'connection') {
      document.getElementById('dot1').className = 'status-dot' + (msg.strip1 ? ' connected' : '');
      document.getElementById('dot2').className = 'status-dot' + (msg.strip2 ? ' connected' : '');
    } else if (msg.type === 'playback') {
      const info = document.getElementById('playbackInfo');
      if (msg.state === 'playing') {
        info.innerHTML = `Step ${msg.step}/${msg.total} <span class="playback-color" style="background:${msg.color}"></span> ${msg.color}` +
          (msg.loop ? ' [loop]' : '');
      } else {
        info.textContent = 'Stopped';
      }
    } else if (msg.type === 'error') {
      showToast(msg.message, true);
    }
  };
  ws.onclose = () => setTimeout(connectWS, 2000);
}

// --- Init ---
(async function init() {
  await loadEffects();
  await loadPresets();
  addStep();
  connectWS();
})();
</script>
</body>
</html>
